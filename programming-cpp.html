<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programming C++ | EDU-TECH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    min-height: 100vh;
    padding: 25px;

    background:
        radial-gradient(circle at 10% 20%,rgba(34,211,238,.3),transparent 25%),
        radial-gradient(circle at 90% 70%,rgba(16,185,129,.2),transparent 25%),
        linear-gradient(135deg,#061c2a,#062f3a,#102b3c);

    color: white;
}

.container {
    max-width: 950px;
    margin: auto;

    padding: 30px;

    background: rgba(3,22,35,.9);
    backdrop-filter: blur(15px);

    border-radius: 32px;

    border: 2px solid rgba(45,212,191,.2);

    box-shadow: 0 25px 60px rgba(0,0,0,.4);

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
}

.icon {
    width: 80px;
    height: 80px;

    margin: auto auto 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;

    background: linear-gradient(135deg,#06b6d4,#14b8a6);

    border-radius: 25px;

    box-shadow:
        0 0 30px rgba(20,184,166,.35);
}

h1 {
    font-size: clamp(27px,5vw,42px);

    background:
        linear-gradient(
            90deg,
            #67e8f9,
            #5eead4,
            #a7f3d0
        );

    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #9dcbd1;
    margin-top: 8px;
}

.language-buttons {
    display: flex;
    gap: 12px;
    margin: 25px 0;
}

.language-btn {
    flex: 1;

    padding: 15px;

    border: none;
    border-radius: 18px;

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.language-btn:hover {
    transform: translateY(-3px);
}

.language-btn.active {
    background: linear-gradient(135deg,#06b6d4,#14b8a6);

    box-shadow:
        0 8px 25px rgba(20,184,166,.3);
}

.video-card {
    padding: 10px;

    background: rgba(0,0,0,.3);

    border-radius: 25px;
}

video {
    width: 100%;

    aspect-ratio: 16/9;

    display: block;

    background: black;

    border-radius: 18px;
}

.current {
    text-align: center;
    margin: 14px 0;

    color: #86aeb5;
}

.current span {
    color: #67e8f9;
    font-weight: bold;
}

.info {
    margin-top: 20px;
    padding: 22px;

    border-radius: 22px;

    background: rgba(20,184,166,.08);

    border:
        1px solid
        rgba(45,212,191,.18);
}

.info h2 {
    color: #67e8f9;
    margin-bottom: 10px;
}

.info p {
    color: #d3eaeb;
    line-height: 1.7;
}

.watch-btn {
    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #14b8a6
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.watch-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 35px
        rgba(20,184,166,.35);
}

.tip {
    text-align: center;
    margin-top: 18px;

    color: #66888e;

    font-size: 13px;
}

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .icon {
        width: 65px;
        height: 65px;
        font-size: 32px;
    }

    .language-btn {
        font-size: 14px;
        padding: 12px 5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">💻</div>

        <h1>PROGRAMMING C++</h1>

        <p class="subtitle">
            Code your ideas and build something awesome 🚀
        </p>

    </div>

    <div class="language-buttons">

        <button
            id="engBtn"
            class="language-btn active"
            onclick="changeLanguage('eng')">
            🇬🇧 ENG
        </button>

        <button
            id="bcBtn"
            class="language-btn"
            onclick="changeLanguage('bc')">
            🇨🇳 BC
        </button>

    </div>

    <div class="video-card">

        <video
            id="lessonVideo"
            controls
            playsinline
            preload="metadata">

            <source
                id="videoSource"
                src="Programming%20C%2B%2B.mp4"
                type="video/mp4">

            Your browser does not support video.

        </video>

    </div>

    <div class="current">
        Currently watching:
        <span id="languageText">English 🇬🇧</span>
    </div>

    <div class="info">

        <h2>💻 C++ Programming</h2>

        <p>
            Explore programming concepts and learn how C++ can be
            used to create programs, solve problems and develop logic.
        </p>

    </div>

    <button
        class="watch-btn"
        onclick="playVideo()">
        ▶️ Watch Lesson
    </button>

    <p class="tip">
        🚀 Choose your language and start coding!
    </p>

</div>

<script>

const video = document.getElementById("lessonVideo");
const source = document.getElementById("videoSource");

const engBtn = document.getElementById("engBtn");
const bcBtn = document.getElementById("bcBtn");

const languageText = document.getElementById("languageText");

function changeLanguage(language) {

    if (language === "eng") {

        source.src = "Programming%20C%2B%2B.mp4";

        engBtn.classList.add("active");
        bcBtn.classList.remove("active");

        languageText.textContent = "English 🇬🇧";

    } else {

        source.src = "Programming%20C%2B%2B%20bc.mp4";

        bcBtn.classList.add("active");
        engBtn.classList.remove("active");

        languageText.textContent = "Bahasa Cina 🇨🇳";
    }

    video.load();
}

function playVideo() {

    video.play().catch(() => {
        console.log("Press the play button on the video.");
    });
}

</script>

</body>
</html>
