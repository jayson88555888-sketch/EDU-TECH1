<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Basic Math | EDU-TECH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    min-height: 100vh;
    padding: 25px;

    background:
        radial-gradient(circle at 10% 15%,rgba(244,114,182,.28),transparent 25%),
        radial-gradient(circle at 90% 80%,rgba(129,140,248,.25),transparent 25%),
        linear-gradient(135deg,#171435,#281746,#111a40);

    color: white;
}

.container {
    max-width: 950px;
    margin: auto;

    padding: 30px;

    background: rgba(20,15,50,.9);
    backdrop-filter: blur(15px);

    border-radius: 32px;
    border: 2px solid rgba(244,114,182,.2);

    box-shadow: 0 25px 60px rgba(0,0,0,.4);

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
}

.icon {
    width: 80px;
    height: 80px;

    margin: auto auto 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 42px;

    background: linear-gradient(135deg,#f472b6,#8b5cf6);
    border-radius: 25px;

    box-shadow: 0 0 30px rgba(244,114,182,.35);
}

h1 {
    font-size: clamp(28px,5vw,42px);

    background: linear-gradient(90deg,#f9a8d4,#c4b5fd,#93c5fd);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #c6c0e4;
    margin-top: 8px;
}

.language-buttons {
    display: flex;
    gap: 12px;
    margin: 25px 0;
}

.language-btn {
    flex: 1;
    padding: 15px;

    border: none;
    border-radius: 18px;

    background: rgba(255,255,255,.08);

    color: white;
    font-weight: bold;
    font-size: 16px;

    cursor: pointer;
    transition: .25s;
}

.language-btn:hover {
    transform: translateY(-3px);
}

.language-btn.active {
    background: linear-gradient(135deg,#ec4899,#8b5cf6);
    box-shadow: 0 8px 25px rgba(236,72,153,.3);
}

.video-card {
    padding: 10px;

    background: rgba(0,0,0,.3);
    border-radius: 25px;
}

video {
    width: 100%;
    aspect-ratio: 16/9;

    display: block;

    border-radius: 18px;
    background: black;
}

.current {
    text-align: center;
    margin: 14px 0;
    color: #a9a1c7;
}

.current span {
    color: #f9a8d4;
    font-weight: bold;
}

.info {
    margin-top: 20px;
    padding: 22px;

    border-radius: 22px;

    background: rgba(236,72,153,.08);
    border: 1px solid rgba(244,114,182,.18);
}

.info h2 {
    color: #f9a8d4;
    margin-bottom: 10px;
}

.info p {
    line-height: 1.7;
    color: #e5ddf3;
}

.watch-btn {
    width: 100%;
    margin-top: 20px;

    padding: 17px;

    border: none;
    border-radius: 18px;

    background: linear-gradient(135deg,#ec4899,#8b5cf6);

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: .25s;

    box-shadow: 0 10px 30px rgba(236,72,153,.25);
}

.watch-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(139,92,246,.4);
}

.tip {
    text-align: center;
    margin-top: 18px;
    color: #8981a9;
    font-size: 13px;
}

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .icon {
        width: 65px;
        height: 65px;
        font-size: 34px;
    }

    .language-btn {
        font-size: 14px;
        padding: 12px 5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">🧮</div>

        <h1>BASIC MATH</h1>

        <p class="subtitle">
            Numbers, counting & mathematical thinking ✨
        </p>

    </div>

    <div class="language-buttons">

        <button
            id="engBtn"
            class="language-btn active"
            onclick="changeLanguage('eng')">
            🇬🇧 ENG
        </button>

        <button
            id="bcBtn"
            class="language-btn"
            onclick="changeLanguage('bc')">
            🇨🇳 BC
        </button>

    </div>

    <div class="video-card">

        <video
            id="lessonVideo"
            controls
            playsinline
            preload="metadata">

            <source
                id="videoSource"
                src="basic%20math.mp4"
                type="video/mp4">

            Your browser does not support video.

        </video>

    </div>

    <div class="current">
        Currently watching:
        <span id="languageText">English 🇬🇧</span>
    </div>

    <div class="info">

        <h2>🔢 Numbers & Counting</h2>

        <p>
            Learn the fundamentals of numbers and counting through
            simple examples and easy-to-understand explanations.
        </p>

    </div>

    <button
        class="watch-btn"
        onclick="playVideo()">
        ▶️ Watch Lesson
    </button>

    <p class="tip">
        🌸 Pick your language and start learning!
    </p>

</div>

<script>

const video = document.getElementById("lessonVideo");
const source = document.getElementById("videoSource");

const engBtn = document.getElementById("engBtn");
const bcBtn = document.getElementById("bcBtn");

const languageText = document.getElementById("languageText");

function changeLanguage(language) {

    if (language === "eng") {

        source.src = "basic%20math.mp4";

        engBtn.classList.add("active");
        bcBtn.classList.remove("active");

        languageText.textContent = "English 🇬🇧";

    } else {

        source.src = "basic%20math%20BC.mp4";

        bcBtn.classList.add("active");
        engBtn.classList.remove("active");

        languageText.textContent = "Bahasa Cina 🇨🇳";
    }

    video.load();
}

function playVideo() {

    video.play().catch(() => {
        console.log("Press the play button on the video.");
    });
}

</script>

</body>
</html>
