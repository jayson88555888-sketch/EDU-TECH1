<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Database | EDU-TECH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 10%, rgba(99,102,241,.35), transparent 25%),
        radial-gradient(circle at 90% 20%, rgba(34,211,238,.25), transparent 25%),
        linear-gradient(135deg, #07152f, #111a45, #1e1650);
    color: white;
    padding: 25px;
    overflow-x: hidden;
}

/* Floating decorations */
body::before,
body::after {
    content: "✦";
    position: fixed;
    font-size: 70px;
    color: rgba(255,255,255,.08);
    animation: float 5s ease-in-out infinite;
    pointer-events: none;
}

body::before {
    left: 5%;
    top: 10%;
}

body::after {
    right: 5%;
    bottom: 10%;
    animation-delay: 2s;
}

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;

    background: rgba(8, 18, 48, .88);
    backdrop-filter: blur(15px);

    border: 2px solid rgba(96,165,250,.25);
    border-radius: 32px;

    padding: 30px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        0 0 35px rgba(59,130,246,.15);

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.icon {
    width: 80px;
    height: 80px;
    margin: auto auto 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;

    background: linear-gradient(135deg,#60a5fa,#818cf8);
    border-radius: 25px;

    box-shadow: 0 0 25px rgba(96,165,250,.4);

    animation: bounce 3s ease-in-out infinite;
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

h1 {
    font-size: clamp(27px,5vw,42px);
    margin-bottom: 8px;

    background: linear-gradient(90deg,#7dd3fc,#a5b4fc,#c4b5fd);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #b8c7e6;
    font-size: 16px;
}

.language-buttons {
    display: flex;
    gap: 12px;
    margin: 25px 0;
}

.language-btn {
    flex: 1;
    padding: 15px;

    border: none;
    border-radius: 18px;

    background: rgba(255,255,255,.08);
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    transition: .25s;
}

.language-btn:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.14);
}

.language-btn.active {
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    box-shadow: 0 8px 25px rgba(99,102,241,.35);
}

.video-card {
    padding: 10px;

    background: rgba(0,0,0,.25);
    border-radius: 25px;

    border: 1px solid rgba(255,255,255,.1);
}

video {
    width: 100%;
    display: block;

    border-radius: 18px;
    background: #000;

    aspect-ratio: 16/9;
}

.current {
    text-align: center;
    margin: 14px 0;

    color: #aebddc;
}

.current span {
    color: #7dd3fc;
    font-weight: bold;
}

.info {
    margin-top: 20px;
    padding: 22px;

    border-radius: 22px;

    background: linear-gradient(
        135deg,
        rgba(59,130,246,.13),
        rgba(139,92,246,.13)
    );

    border: 1px solid rgba(129,140,248,.2);
}

.info h2 {
    margin-bottom: 10px;
    color: #93c5fd;
}

.info p {
    color: #d6e1f5;
    line-height: 1.7;
}

.watch-btn {
    width: 100%;
    margin-top: 20px;

    padding: 17px;

    border: none;
    border-radius: 18px;

    background: linear-gradient(135deg,#38bdf8,#6366f1);

    color: white;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 10px 25px rgba(59,130,246,.25);

    transition: .25s;
}

.watch-btn:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 15px 30px rgba(99,102,241,.4);
}

.tip {
    text-align: center;
    margin-top: 18px;
    color: #8395ba;
    font-size: 13px;
}

@media(max-width:600px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
        border-radius: 25px;
    }

    .icon {
        width: 65px;
        height: 65px;
        font-size: 34px;
    }

    .language-btn {
        padding: 12px 5px;
        font-size: 14px;
    }

    .info {
        padding: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">🗄️</div>

        <h1>DATABASE</h1>

        <p class="subtitle">
            Learn, explore & understand databases 💙
        </p>

    </div>

    <div class="language-buttons">

        <button
            id="engBtn"
            class="language-btn active"
            onclick="changeLanguage('eng')">
            🇬🇧 ENG
        </button>

        <button
            id="bcBtn"
            class="language-btn"
            onclick="changeLanguage('bc')">
            🇨🇳 BC
        </button>

    </div>

    <div class="video-card">

        <video
            id="lessonVideo"
            controls
            playsinline
            preload="metadata">

            <source
                id="videoSource"
                src="database.mp4"
                type="video/mp4">

            Your browser does not support video.
        </video>

    </div>

    <div class="current">
        Currently watching:
        <span id="languageText">English 🇬🇧</span>
    </div>

    <div class="info">

        <h2>📚 Database Fundamentals</h2>

        <p>
            Discover what databases are, how information is stored,
            and how databases help us organize and manage data.
        </p>

    </div>

    <button
        class="watch-btn"
        onclick="playVideo()">
        ▶️ Watch Lesson
    </button>

    <p class="tip">
        💡 Choose your language and press Watch Lesson!
    </p>

</div>

<script>

const video = document.getElementById("lessonVideo");
const source = document.getElementById("videoSource");

const engBtn = document.getElementById("engBtn");
const bcBtn = document.getElementById("bcBtn");

const languageText = document.getElementById("languageText");

let selectedLanguage = "eng";

function changeLanguage(language) {

    selectedLanguage = language;

    if (language === "eng") {

        source.src = "database.mp4";

        engBtn.classList.add("active");
        bcBtn.classList.remove("active");

        languageText.textContent = "English 🇬🇧";

    } else {

        source.src = "database%20BC.mp4";

        bcBtn.classList.add("active");
        engBtn.classList.remove("active");

        languageText.textContent = "Bahasa Cina 🇨🇳";
    }

    video.load();
}

function playVideo() {

    video.play().catch(() => {
        console.log("Press the play button on the video.");
    });
}

</script>

</body>
</html>
