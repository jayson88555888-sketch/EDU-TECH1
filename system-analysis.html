<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Analysis | EDU-TECH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Trebuchet MS", Arial, sans-serif;

    min-height: 100vh;

    padding: 25px;

    background:
        radial-gradient(circle at 10% 15%,rgba(251,191,36,.25),transparent 25%),
        radial-gradient(circle at 90% 75%,rgba(249,115,22,.2),transparent 25%),
        linear-gradient(135deg,#20170b,#33200d,#17152f);

    color: white;
}

.container {
    width: 100%;
    max-width: 950px;

    margin: auto;

    padding: 30px;

    background: rgba(30,22,10,.9);

    backdrop-filter: blur(15px);

    border-radius: 32px;

    border: 2px solid rgba(251,191,36,.18);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45);

    animation: appear .7s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
}

.icon {
    width: 80px;
    height: 80px;

    margin: auto auto 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #f97316
        );

    border-radius: 25px;

    box-shadow:
        0 0 30px
        rgba(245,158,11,.35);
}

h1 {
    font-size: clamp(27px,5vw,42px);

    background:
        linear-gradient(
            90deg,
            #fde68a,
            #fdba74,
            #fca5a5
        );

    -webkit-background-clip: text;

    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #d3c2a1;
}

.language-buttons {
    display: flex;

    gap: 12px;

    margin: 25px 0;
}

.language-btn {
    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 18px;

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.language-btn:hover {
    transform: translateY(-3px);
}

.language-btn.active {
    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #f97316
        );

    box-shadow:
        0 8px 25px
        rgba(249,115,22,.3);
}

.video-card {
    padding: 10px;

    background: rgba(0,0,0,.3);

    border-radius: 25px;
}

video {
    width: 100%;

    aspect-ratio: 16/9;

    display: block;

    background: black;

    border-radius: 18px;
}

.current {
    text-align: center;

    margin: 14px 0;

    color: #ad9d7d;
}

.current span {
    color: #fde68a;

    font-weight: bold;
}

.info {
    margin-top: 20px;

    padding: 22px;

    border-radius: 22px;

    background:
        rgba(245,158,11,.08);

    border:
        1px solid
        rgba(251,191,36,.18);
}

.info h2 {
    color: #fde68a;

    margin-bottom: 10px;
}

.info p {
    color: #eadfc9;

    line-height: 1.7;
}

.watch-btn {
    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #f97316
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.watch-btn:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 35px
        rgba(249,115,22,.35);
}

.tip {
    text-align: center;

    margin-top: 18px;

    color: #8d7c5d;

    font-size: 13px;
}

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .icon {
        width: 65px;
        height: 65px;

        font-size: 32px;
    }

    .language-btn {
        font-size: 14px;
        padding: 12px 5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">⚙️</div>

        <h1>SYSTEM ANALYSIS</h1>

        <p class="subtitle">
            Understand systems, processes & problem solving 🔍
        </p>

    </div>

    <div class="language-buttons">

        <button
            id="engBtn"
            class="language-btn active"
            onclick="changeLanguage('eng')">
            🇬🇧 ENG
        </button>

        <button
            id="bcBtn"
            class="language-btn"
            onclick="changeLanguage('bc')">
            🇨🇳 BC
        </button>

    </div>

    <div class="video-card">

        <video
            id="lessonVideo"
            controls
            playsinline
            preload="metadata">

            <source
                id="videoSource"
                src="sistem%20analysis.mp4"
                type="video/mp4">

            Your browser does not support video.

        </video>

    </div>

    <div class="current">

        Currently watching:

        <span id="languageText">
            English 🇬🇧
        </span>

    </div>

    <div class="info">

        <h2>🔍 System Analysis</h2>

        <p>
            Learn how systems are studied, analyzed and improved.
            Explore how information, processes and users work together
            inside a system.
        </p>

    </div>

    <button
        class="watch-btn"
        onclick="playVideo()">

        ▶️ Watch Lesson

    </button>

    <p class="tip">
        ✨ Select a language and begin your lesson!
    </p>

</div>

<script>

const video =
    document.getElementById("lessonVideo");

const source =
    document.getElementById("videoSource");

const engBtn =
    document.getElementById("engBtn");

const bcBtn =
    document.getElementById("bcBtn");

const languageText =
    document.getElementById("languageText");


function changeLanguage(language) {

    if (language === "eng") {

        source.src =
            "sistem%20analysis.mp4";

        engBtn.classList.add("active");

        bcBtn.classList.remove("active");

        languageText.textContent =
            "English 🇬🇧";

    } else {

        source.src =
            "sistem%20analysis%20bc.mp4";

        bcBtn.classList.add("active");

        engBtn.classList.remove("active");

        languageText.textContent =
            "Bahasa Cina 🇨🇳";
    }

    video.load();
}


function playVideo() {

    video.play().catch(() => {

        console.log(
            "Press the play button on the video."
        );

    });
}

</script>

</body>
</html>
